###############################################################################
# PareFlux Gate Traefik integration stack
# FR: Charge le plugin local dans une version stable épinglée de Traefik et
#     expose un service de test uniquement sur la boucle locale.
# EN: Loads the local plugin in a pinned stable Traefik version and exposes a
#     test service only on loopback.
# Called by: developers and CI integration jobs
# Calls: Traefik and traefik/whoami containers
###############################################################################
services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    environment:
      DISABLE_ONLINE_API: "true"
      BOUNCER_KEY_gate: test-gate-key
      COLLECTIONS: >-
        crowdsecurity/traefik
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-crs
        crowdsecurity/appsec-generic-rules
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - ./appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 5s
      timeout: 5s
      retries: 24

  traefik:
    build:
      context: ..
      dockerfile: test/Dockerfile.traefik
    image: pareflux-gate-traefik:test
    command:
      - --api.dashboard=false
      - --ping=true
      - --providers.file.directory=/run/fixture-dynamic
      - --providers.file.watch=true
      - --entrypoints.web.transport.respondingtimeouts.readtimeout=5s
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.middlewares=pareflux@docker
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --experimental.localplugins.pareflux.modulename=github.com/vandman/pareflux-traefik-gate
    ports:
      - 127.0.0.1:${PAREFLUX_TEST_PORT:-18080}:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      interval: 2s
      timeout: 2s
      retries: 20
    security_opt:
      - no-new-privileges:true
    depends_on:
      crowdsec:
        condition: service_healthy

  whoami:
    image: traefik/whoami:v1.12.0
    labels:
      traefik.enable: "true"
      traefik.http.routers.test.entrypoints: web
      traefik.http.routers.test.rule: Host(`pareflux.localhost`)
      traefik.http.routers.test.middlewares: pareflux
      traefik.http.services.test.loadbalancer.server.port: "80"
      traefik.http.middlewares.pareflux.plugin.pareflux.enabled: "true"
      traefik.http.middlewares.pareflux.plugin.pareflux.logLevel: DEBUG
      # FR: Identités factices uniquement dans cette pile isolée publiée sur loopback.
      # EN: Synthetic identities only in this isolated loopback-published stack.
      traefik.http.middlewares.pareflux.plugin.pareflux.forwardedHeadersCustomName: X-Pareflux-Fixture-Client
      traefik.http.middlewares.pareflux.plugin.pareflux.forwardedHeadersTrustedIps[0]: 172.16.0.0/12
      traefik.http.middlewares.pareflux.plugin.pareflux.forwardedHeadersTrustedIps[1]: 192.168.0.0/16
      traefik.http.middlewares.pareflux.plugin.pareflux.forwardedHeadersTrustedIps[2]: 10.0.0.0/8
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecMode: stream
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecLapiScheme: http
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecLapiHost: crowdsec:8080
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecLapiPath: /
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecLapiKey: test-gate-key
      traefik.http.middlewares.pareflux.plugin.pareflux.updateIntervalSeconds: "1"
      traefik.http.middlewares.pareflux.plugin.pareflux.remediationHeadersCustomName: X-Pareflux-Remediation
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecReadTimeoutSeconds: "5"
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecBodyExceptions[0].host: pareflux.localhost
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecBodyExceptions[0].pathRegexp: ^/uploads/
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecBodyExceptions[0].methods[0]: POST
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecEnabled: "true"
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecScheme: http
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecHost: crowdsec:7422
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecPath: /
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecFailureBlock: "true"
      traefik.http.middlewares.pareflux.plugin.pareflux.crowdsecAppsecUnreachableBlock: "true"
    security_opt:
      - no-new-privileges:true

  upload-fixture:
    image: pareflux-gate-traefik:test
    pull_policy: never
    entrypoint: [/usr/local/bin/pareflux-upload-fixture]
    labels:
      traefik.enable: "true"
      traefik.http.routers.upload-fixture.entrypoints: web
      traefik.http.routers.upload-fixture.rule: Host(`pareflux.localhost`) && PathPrefix(`/uploads/`)
      traefik.http.routers.upload-fixture.priority: "100"
      traefik.http.routers.upload-fixture.middlewares: pareflux
      traefik.http.routers.upload-fixture.service: upload-fixture
      traefik.http.services.upload-fixture.loadbalancer.server.port: "8080"
    security_opt:
      - no-new-privileges:true
    depends_on:
      traefik:
        condition: service_healthy

volumes:
  crowdsec-data:
  crowdsec-config:
