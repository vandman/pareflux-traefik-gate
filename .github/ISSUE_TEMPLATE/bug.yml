###############################################################################
# PareFlux Gate bug report form
# FR: Collecte les versions, la reproduction et le contexte reseau necessaires
#     pour qualifier un defaut public sans demander de secret.
# EN: Collects versions, reproduction steps, and network context required to
#     qualify a public defect without requesting secrets.
# Called by: GitHub new issue page
# Calls: GitHub Issues and PareFlux maintainers
###############################################################################

---
# yamllint disable rule:line-length

name: Bug report
description: Report a reproducible PareFlux Gate problem
title: "[Bug]: "
labels:
  - bug
  - "status: triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PareFlux Gate.

        For a vulnerability, exploit, authentication bypass, leaked credential, or other sensitive security problem, stop here and use [private vulnerability reporting](https://github.com/vandman/pareflux-traefik-gate/security/advisories/new).

  - type: input
    id: pareflux-version
    attributes:
      label: PareFlux Gate version
      description: Use the immutable release tag, as shown in the public GitHub releases.
      placeholder: Latest published tag, for example vX.Y.Z
    validations:
      required: true

  - type: input
    id: traefik-version
    attributes:
      label: Traefik version
      placeholder: v3.x.y
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Traefik local plugin
        - Traefik experimental plugin catalog
        - Custom build or test environment
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Explain what fails and when it started.
      placeholder: Describe the observable behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Sanitized configuration
      description: Remove API keys, tokens, cookies, private addresses, and identifying data.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: network-path
    attributes:
      label: Network and client IP path
      description: Describe proxies between the client and Traefik and which forwarded headers are trusted. Use sanitized addresses.
      placeholder: Client -> CDN or proxy -> Traefik -> service
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include only the relevant lines. Remove secrets, cookies, tokens, and identifying data.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checks
      options:
        - label: I reproduced this with the latest stable PareFlux Gate release.
          required: true
        - label: I removed all credentials, secrets, cookies, private addresses, and identifying data.
          required: true
        - label: This report does not disclose a vulnerability or an exploitable security weakness.
          required: true
