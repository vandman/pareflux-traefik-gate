###############################################################################
# PareFlux Gate public contribution verification
# FR: Vérifie sans secret les propositions publiques GitHub contre les sources
#     vendored publiées, sans accès au dépôt de développement GitLab.
# EN: Verifies public GitHub contributions without secrets against published
#     vendored sources and without access to the GitLab development repository.
# Called by: GitHub pull_request and push events
# Calls: actions/checkout, actions/setup-go and Go verification tools
###############################################################################

---
# yamllint disable rule:line-length

name: Verify public contribution

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting, code and licenses
        run: |
          test -z "$(gofmt -l .)"
          go vet -mod=vendor ./...
          go test -mod=vendor -race ./...
          ./scripts/check-licenses.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the real Traefik and CrowdSec stack
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=pareflux-gate-public-test
          PAREFLUX_CI_DOCKER_MODE="$(./scripts/ci-docker.sh probe)"
          export PAREFLUX_CI_DOCKER_MODE

          cleanup() {
            ./scripts/ci-docker.sh compose --project-name "$COMPOSE_PROJECT_NAME" \
              -f test/docker-compose.yml down --volumes
          }
          trap cleanup EXIT

          ./scripts/ci-docker.sh compose --project-name "$COMPOSE_PROJECT_NAME" \
            -f test/docker-compose.yml up --build --detach --wait

          initial_status=000
          for _ in {1..30}; do
            initial_status="$(curl --silent --output /dev/null \
              --write-out '%{http_code}' --header 'Host: pareflux.localhost' \
              http://127.0.0.1:18080/ || true)"
            if [[ "$initial_status" == 200 ]]; then
              break
            fi
            sleep 2
          done
          test "$initial_status" = 200

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: pareflux.localhost' \
            http://127.0.0.1:18080/.env)" = 403

          gateway_ip="$(./scripts/ci-docker.sh network inspect \
            pareflux-gate-public-test_default \
            --format '{{(index .IPAM.Config 0).Gateway}}')"
          ./scripts/ci-docker.sh compose --project-name "$COMPOSE_PROJECT_NAME" \
            -f test/docker-compose.yml exec -T crowdsec cscli decisions add \
            --ip "$gateway_ip" --duration 5m --reason pareflux-public-ci
          sleep 3

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: pareflux.localhost' \
            http://127.0.0.1:18080/)" = 403
          test "$(curl --silent --head --header 'Host: pareflux.localhost' \
            http://127.0.0.1:18080/ | tr -d '\r' | \
            awk -F ': ' 'tolower($1) == "x-pareflux-remediation" {print $2}')" = ban

          ./scripts/ci-docker.sh compose --project-name "$COMPOSE_PROJECT_NAME" \
            -f test/docker-compose.yml exec -T crowdsec cscli decisions delete \
            --ip "$gateway_ip"
          sleep 3
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: pareflux.localhost' \
            http://127.0.0.1:18080/)" = 200
