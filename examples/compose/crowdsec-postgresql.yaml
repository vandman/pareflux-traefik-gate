###############################################################################
# CrowdSec PostgreSQL storage override
# FR: Configure la LAPI CrowdSec de démonstration pour persister ses machines,
#     alertes, décisions et clefs de remédiation dans PostgreSQL.
# EN: Configures the example CrowdSec LAPI to persist its machines, alerts,
#     decisions, and remediation keys in PostgreSQL.
# Called by: CrowdSec container with compose.override.postgresql.yml
# Calls: PostgreSQL service on the internal Compose network
###############################################################################
db_config:
  type: postgresql
  user: crowdsec
  password: ${CROWDSEC_DB_PASSWORD}
  db_name: crowdsec
  host: postgresql
  port: 5432
  sslmode: disable
